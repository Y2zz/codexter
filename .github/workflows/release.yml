name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v1.0.1（必须与 pubspec.yaml 版本一致）'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          if (-not $line) { throw 'Version not found in pubspec.yaml' }
          $fullVersion = $line.Matches[0].Groups[1].Value.Trim()
          $version = $fullVersion.Split('+')[0]
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match pubspec version $fullVersion (expected $expectedTag)"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Releasing Codexter $fullVersion"

      - name: Install Flutter
        shell: pwsh
        run: |
          $flutterDir = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $flutterDir
          "$flutterDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flutter info
        shell: pwsh
        run: flutter --version

      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Check formatting
        shell: pwsh
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Test
        shell: pwsh
        run: flutter test

      - name: Resolve release target
        shell: pwsh
        run: |
          $releaseRepo = if ($env:RELEASE_REPOSITORY) { $env:RELEASE_REPOSITORY } else { $env:GITHUB_REPOSITORY }
          $manifestUrl = '${{ vars.UPDATE_MANIFEST_URL }}'
          if (-not $manifestUrl -and $releaseRepo -ne $env:GITHUB_REPOSITORY) {
            $manifestUrl = "https://github.com/$releaseRepo/releases/latest/download/latest.json"
          }
          "TARGET_RELEASE_REPOSITORY=$releaseRepo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TARGET_UPDATE_MANIFEST_URL=$manifestUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release repository: $releaseRepo"
          if ($manifestUrl) { Write-Host "Update manifest: $manifestUrl" }

      - name: Build Windows packages
        shell: pwsh
        run: |
          if ($env:TARGET_UPDATE_MANIFEST_URL) {
            .\scripts\build_windows.ps1 -SkipAnalyze -UpdateManifestUrl $env:TARGET_UPDATE_MANIFEST_URL
          } else {
            .\scripts\build_windows.ps1 -SkipAnalyze
          }

      - name: Generate update manifest
        shell: pwsh
        run: |
          .\scripts\generate_update_manifest.ps1 `
            -Version $env:APP_VERSION `
            -Tag $env:RELEASE_TAG `
            -Repository $env:TARGET_RELEASE_REPOSITORY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Codexter-${{ env.RELEASE_TAG }}-windows
          path: |
            dist/Codexter-*-Setup.exe
            dist/Codexter-*-windows-x64.zip
            dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $env:GH_TOKEN = if ($env:EXTERNAL_RELEASE_TOKEN) { $env:EXTERNAL_RELEASE_TOKEN } else { $env:SOURCE_GITHUB_TOKEN }
          $repo = $env:TARGET_RELEASE_REPOSITORY
          $files = @(
            "dist/Codexter-$env:APP_VERSION-Setup.exe",
            "dist/Codexter-$env:APP_VERSION-windows-x64.zip",
            'dist/latest.json'
          )
          gh release view $env:RELEASE_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber --repo $repo
          } else {
            gh release create $env:RELEASE_TAG @files `
              --repo $repo `
              --title "Codexter $env:APP_VERSION" `
              --generate-notes
          }

      - name: Remove broken v1.0.2 release
        if: env.RELEASE_TAG == 'v1.0.3'
        shell: pwsh
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $env:GH_TOKEN = if ($env:EXTERNAL_RELEASE_TOKEN) { $env:EXTERNAL_RELEASE_TOKEN } else { $env:SOURCE_GITHUB_TOKEN }
          $repo = $env:TARGET_RELEASE_REPOSITORY
          gh release view v1.0.2 --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v1.0.2 --cleanup-tag --yes --repo $repo
            Write-Host "Removed broken v1.0.2 release and tag from $repo"
          } else {
            Write-Host "v1.0.2 release not found; nothing to remove"
          }

  macos-release:
    runs-on: macos-latest
    needs: windows-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release version
        shell: bash
        run: |
          full_version="$(sed -nE 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r')"
          version="${full_version%%+*}"
          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match pubspec version $full_version (expected $expected_tag)" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing Codexter $full_version (macOS)"

      - name: Install Flutter
        shell: bash
        run: |
          flutter_dir="${RUNNER_TEMP}/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$flutter_dir"
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"

      - name: Flutter info
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Resolve release target
        shell: bash
        run: |
          release_repo="${RELEASE_REPOSITORY:-$GITHUB_REPOSITORY}"
          echo "TARGET_RELEASE_REPOSITORY=$release_repo" >> "$GITHUB_ENV"
          echo "Release repository: $release_repo"

      - name: Build macOS package
        run: ./scripts/build_macos.sh --skip-analyze

      - name: Download Windows update manifest
        uses: actions/download-artifact@v4
        with:
          name: Codexter-${{ env.RELEASE_TAG }}-windows
          path: dist-windows

      - name: Patch update manifest with macOS assets
        shell: bash
        run: |
          mkdir -p dist
          if [[ -f dist-windows/latest.json ]]; then
            cp dist-windows/latest.json dist/latest.json
          fi
          chmod +x ./scripts/patch_update_manifest_macos.sh
          ./scripts/patch_update_manifest_macos.sh "$APP_VERSION" "$RELEASE_TAG" "$TARGET_RELEASE_REPOSITORY"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Codexter-${{ env.RELEASE_TAG }}-macos
          path: |
            dist/Codexter-*-macos-*.zip
            dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release assets
        shell: bash
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          export GH_TOKEN="${EXTERNAL_RELEASE_TOKEN:-$SOURCE_GITHUB_TOKEN}"
          repo="$TARGET_RELEASE_REPOSITORY"
          shopt -s nullglob
          files=(dist/Codexter-"$APP_VERSION"-macos-*.zip dist/latest.json)
          if [[ ${#files[@]} -lt 2 ]]; then
            echo "Missing macOS zip or latest.json" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$repo"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$repo" \
              --title "Codexter $APP_VERSION" \
              --generate-notes
          fi
